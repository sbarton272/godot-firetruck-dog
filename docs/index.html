<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Firetruck Dog</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { margin-bottom: 4px; }
  ul { list-style: none; padding: 0; }
  li { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
  .version { font-weight: bold; }
  .date { color: #666; font-size: 0.9em; }
  a.play { display: inline-block; margin-top: 8px; }
</style>
</head>
<body>
<h1>Firetruck Dog</h1>
<audio id="theme-song" src="audio/chief-waffles-theme.mp3" loop controls></audio>
<script>
  // Most browsers block autoplay with sound until the user interacts with the page,
  // so try immediately and fall back to starting on first click/keypress.
  const themeSong = document.getElementById('theme-song');
  themeSong.play().catch(() => {
    const startOnInteraction = () => {
      themeSong.play();
      document.removeEventListener('click', startOnInteraction);
      document.removeEventListener('keydown', startOnInteraction);
    };
    document.addEventListener('click', startOnInteraction);
    document.addEventListener('keydown', startOnInteraction);
  });
</script>
<p>Published versions, newest first.</p>
<ul>
  <li>
    <div class="version">v1</div>
    <div class="date">2026-07-13</div>
    <p>First drivable prototype: drift physics, damage system, win condition.</p>
    <a class="play" href="v1/index.html">Play v1</a>
  </li>
</ul>
</body>
</html>
